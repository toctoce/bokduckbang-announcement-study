log_format toadzip_json escape=json
    '{"timestamp":"$time_iso8601","level":"INFO","event":"proxy.request.completed",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"durationSeconds":$request_time,"upstreamDurationSeconds":"$upstream_response_time",'
    '"upstreamStatus":"$upstream_status"}';

access_log /dev/stdout toadzip_json;
