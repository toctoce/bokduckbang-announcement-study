name: Deploy Dev

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toadzip-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to development server
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, linux, toadzip-dev]
    timeout-minutes: 30
    steps:
      - name: Deploy
        working-directory: ${{ vars.DEV_DEPLOY_PATH }}
        shell: bash
        run: |
          git switch develop
          git pull --ff-only origin develop
          docker compose up -d --build --wait --wait-timeout 180
